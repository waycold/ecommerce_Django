{% extends 'base.html' %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 600px;">
    <div class="auth-header">
      <div class="logo-badge">
        <i class="fas fa-user-cog"></i>
      </div>
      <h2>Editar Perfil</h2>
      <p>Actualiza la información personal de tu cuenta</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="custom-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_user"><i class="fas fa-id-card mr-2"></i>Nombre Completo</label>
        <input type="text" name="user" id="id_user" class="form-control" value="{{ form.user.value|default:'' }}" placeholder="Tu nombre y apellido" required>
      </div>

      <div class="form-group">
        <label for="id_email"><i class="fas fa-envelope mr-2"></i>Correo Electrónico</label>
        <input type="email" name="email" id="id_email" class="form-control" value="{{ form.email.value|default:'' }}" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="id_phone"><i class="fas fa-phone mr-2"></i>Teléfono</label>
        <input type="number" name="phone" id="id_phone" class="form-control" value="{{ form.phone.value|default:'' }}" placeholder="Número de contacto">
      </div>

      <div class="form-group">
        <label for="id_description"><i class="fas fa-comment-alt mr-2"></i>Sobre ti / Descripción</label>
        <textarea name="description" id="id_description" rows="3" class="form-control" placeholder="Cuéntanos un poco sobre ti...">{{ form.description.value|default:'' }}</textarea>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="/profile" class="btn-custom-outline">
          <i class="fas fa-arrow-left mr-1"></i> Cancelar
        </a>
        <button type="submit" class="btn-custom-primary" style="width: auto; padding-left: 30px; padding-right: 30px;">
          <i class="fas fa-save mr-2"></i> Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
