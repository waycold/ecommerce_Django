{% extends 'base.html' %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="sober-card">
        <div class="sober-header d-flex align-items-center justify-content-between">
          <div>
            <h3><i class="fas fa-user-cog text-primary mr-2"></i>Editar Perfil</h3>
            <p>Actualiza tus datos personales y dirección de envío</p>
          </div>
          <a href="/profile" class="sober-btn-outline btn-sm">
            <i class="fas fa-arrow-left mr-1"></i> Volver al Perfil
          </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="custom-form">
          {% csrf_token %}

          <!-- Sección 1: Datos Personales -->
          <div class="form-section-title">
            <i class="fas fa-user-circle mr-2"></i> Información Personal
          </div>

          <div class="row">
            <div class="col-md-6 form-group">
              <label for="id_phone"><i class="fas fa-phone mr-1 text-muted"></i> Teléfono</label>
              <input type="text" name="phone" id="id_phone" class="form-control sober-input" value="{{ form.phone.value|default:'' }}" placeholder="Número de contacto">
            </div>

            <div class="col-md-6 form-group">
              <label for="id_birth_date"><i class="fas fa-birthday-cake mr-1 text-muted"></i> Fecha de Nacimiento</label>
              <input type="date" name="birth_date" id="id_birth_date" class="form-control sober-input" value="{{ form.birth_date.value|date:'Y-m-d'|default:'' }}">
            </div>

            <div class="col-12 form-group">
              <label for="id_description"><i class="fas fa-align-left mr-1 text-muted"></i> Bio / Descripción</label>
              <textarea name="description" id="id_description" rows="3" class="form-control sober-input" placeholder="Cuéntanos un poco sobre ti...">{{ form.description.value|default:'' }}</textarea>
            </div>
          </div>

          <hr class="my-4">

          <!-- Sección 2: Dirección y Ubicación -->
          <div class="form-section-title">
            <i class="fas fa-map-marked-alt mr-2"></i> Dirección y Ubicación
          </div>

          <div class="row">
            <div class="col-12 form-group">
              <label for="id_address_line"><i class="fas fa-road mr-1 text-muted"></i> Calle y Número (Piso, Dpto)</label>
              <input type="text" name="address_line" id="id_address_line" class="form-control sober-input" value="{{ form.address_line.value|default:'' }}" placeholder="Ej: Av. Corrientes 1234, 4° B">
            </div>

            <div class="col-md-6 form-group">
              <label for="id_city"><i class="fas fa-city mr-1 text-muted"></i> Ciudad</label>
              <input type="text" name="city" id="id_city" class="form-control sober-input" value="{{ form.city.value|default:'' }}" placeholder="Ciudad">
            </div>

            <div class="col-md-6 form-group">
              <label for="id_province"><i class="fas fa-map mr-1 text-muted"></i> Provincia / Estado / Región</label>
              <input type="text" name="province" id="id_province" class="form-control sober-input" value="{{ form.province.value|default:'' }}" placeholder="Provincia o Estado">
            </div>

            <div class="col-md-6 form-group">
              <label for="id_zip_code"><i class="fas fa-mail-bulk mr-1 text-muted"></i> Código Postal</label>
              <input type="text" name="zip_code" id="id_zip_code" class="form-control sober-input" value="{{ form.zip_code.value|default:'' }}" placeholder="Código Postal">
            </div>

            <div class="col-md-6 form-group">
              <label for="id_country"><i class="fas fa-globe-americas mr-1 text-muted"></i> País</label>
              <input type="text" name="country" id="id_country" class="form-control sober-input" value="{{ form.country.value|default:'Argentina' }}" placeholder="País de residencia">
              <small class="form-text text-muted">Compras fuera de Argentina aplican tarifa de envío internacional.</small>
            </div>
          </div>

          <div class="d-flex justify-content-end align-items-center mt-4 pt-3 border-top">
            <a href="/profile" class="sober-btn-outline mr-3">
              Cancelar
            </a>
            <button type="submit" class="sober-btn-primary">
              <i class="fas fa-save mr-2"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
