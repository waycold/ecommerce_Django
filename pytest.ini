[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = tests.py test_*.py *_tests.py
norecursedirs = scratch analytics/scratch venv .git .gemini
markers =
    integration: needs a real service (e.g. Testcontainers-backed Postgres) instead of the default SQLite settings -- excluded from the fast default run via `pytest -m "not integration"`, run on its own via `pytest -m integration`. No test uses this marker yet; registered ahead of time so the eventual Testcontainers work doesn't need another pytest.ini change.

