{% extends 'base.html' %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-badge">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2>Crear Cuenta</h2>
      <p>Regístrate para comprar componentes al mejor precio</p>
    </div>

    {% if error %}
    <div class="alert alert-danger text-center font-weight-bold" role="alert" style="border-radius: 10px;">
      <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
    </div>
    {% endif %}

    <form action="/signup/" method="POST" class="custom-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><i class="fas fa-user mr-2"></i>Nombre de usuario</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Elige un usuario" required autofocus>
      </div>

      <div class="form-group">
        <label for="password1"><i class="fas fa-key mr-2"></i>Contraseña</label>
        <input type="password" name="password1" id="password1" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="password2"><i class="fas fa-check-circle mr-2"></i>Confirmar Contraseña</label>
        <input type="password" name="password2" id="password2" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-custom-primary mt-3">
        <i class="fas fa-user-check mr-2"></i>Registrarme
      </button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes una cuenta? <a href="/login/">Inicia sesión aquí</a>
    </div>
  </div>
</div>

{% endblock %}
